# Builds the site and deploys it to Cloudflare Pages (project shv-meteo)
# once ci has passed on main, or by hand from main.
#
# Secrets: CLOUDFLARE_API_TOKEN (Account: Cloudflare Pages edit) and
# CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  # Runs only after ci on a push to main: the if below checks the event and
  # the commit, so a pull request's ci never starts a deploy.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # Only the head of main is deployed. For a workflow_run, github.sha is
    # main's head when this run starts: when ci passed on an older commit
    # (merges back to back, or ci finishing out of order), the commit that
    # replaced it deploys when its own ci passes, so this run is skipped. A
    # manual run builds main's head, and only main's: started on another
    # branch it would ship that branch as production.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    # One deploy at a time, and a newer one cancels a running one, which
    # ships everything the older would. A run cancelled mid-upload creates
    # no deployment, so the site stays on the last finished one.
    concurrency:
      group: deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shv-meteo.pages.dev
    env:
      # The commit ci tested, not whatever main points at by now.
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Cloudflare token is set on this step alone, so npm ci and the
      # build, which run third-party code, cannot read it from their
      # environment.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy dist
          --project-name shv-meteo
          --branch main
          --commit-hash "$COMMIT_SHA"
