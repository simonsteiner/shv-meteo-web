# The checks lefthook runs on staged files (not its token budget or dash
# check, which need the hooks' remote scripts), over the whole tree, plus
# the tests, the typecheck and the build. deploy.yml deploys main once this passes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx rumdl check .
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
